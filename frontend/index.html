<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Matthew and Hilary's Wedding</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="vendor/sakura.css" type="text/css">

    <style type="text/css">
      body {
        font-family: "Roboto Condensed", serif;
        font-optical-sizing: auto;
        font-style: normal;
        text-align: center;
      }

      footer {
        color: #707070;
        font-size: 1rem;
        margin-bottom: 3em;
        margin-top: 3em;
      }

      h1, h2, h3 {
        font-family: "Roboto Condensed", serif;
        font-optical-sizing: auto;
        font-style: normal;
      }

      img {
        max-height: 500px;
        margin: 20px;
        max-width: 90%;
      }

      p {
        margin-bottom: 0;
        padding-bottom: 0.5rem;
      }

      p.collapsible {
        margin: 0;
        max-height: 0;
        overflow: hidden;
        padding: 0;
        transition: all 0.2s ease-out;
      }

      p.collapsible:hover {
        margin-bottom: 1rem;
        max-height: 9999px;
      }

      p:hover + p.collapsible {
        margin-bottom: 1rem;
        max-height: 9999px;
      }

      span.nav {
        color: #144f5a;
        font-size: 0.75em;
      }

      ul {
        margin-bottom: 0;
        padding-bottom: 0;
      }

      div#details, div#schedule {
        border-left: black solid 1px;
        margin: auto;
        padding-left: 20px;
        text-align: left;
        width: 95%;
      }

      div#schedule {
        margin-top: 2rem;
      }

      .bold {
        font-weight: bold;
      }

      .strikethrough {
        text-decoration: line-through;
      }

      /* Auto-expand collapsibles on mobile */
      @media (max-width: 768px) {
        p.collapsible {
          margin-bottom: 1rem;
          max-height: none;
          overflow: visible;
          padding: initial;
        }
      }
    </style>
  </head>

  <body>
    <h1>Matthew and Hilary <span class="strikethrough">are getting</span> got married!</h1>
    <h3>October 25th, 2025 • in Stowe, Vermont</h3>
    <img src="images/matthewandhilary.png" />
    <div id="details">
      <p><span class="bold">When did it happen?</span> • October 25th, 2025</p>
      <p><span class="bold">Where was it?</span> • <a href="https://www.vontrappresort.com">Trapp Family Lodge</a>, <a href="https://maps.app.goo.gl/wpjX1iqSqvFVr4cR7">700 Trapp Hill Rd, Stowe, VT</a></p>
      <p><span class="bold">Photos?</span> • See <a href="slideshow.html">the slideshow</a>, or <a href="https://drive.google.com/drive/folders/1W8vIjwzOogmQ5TCeodPbVJ5FNJZqyW09?usp=sharing">download them</a>. </p>
    </div>

    <footer>
      <a href="https://github.com/spacez320/matthewandhilary">Matt made this.</a>
    </footer>
  </body>
</html>
